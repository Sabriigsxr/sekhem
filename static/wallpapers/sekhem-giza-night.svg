<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" role="img" aria-label="SEKHEM — Giza at night, black desert and gold pyramids">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.38" stop-color="#0d0b14"/>
      <stop offset="0.62" stop-color="#1a130d"/>
      <stop offset="0.78" stop-color="#241a10"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e3a3"/>
      <stop offset="0.35" stop-color="#e8c766" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8c766" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#c9a227" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="0.35" stop-color="#1c1610"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <linearGradient id="pGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c11"/>
      <stop offset="0.5" stop-color="#171209"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </linearGradient>
    <linearGradient id="pFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1710"/>
      <stop offset="0.45" stop-color="#332614"/>
      <stop offset="0.62" stop-color="#191209"/>
      <stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9 0 0 0 0 0.82 0 0 0 0 0.6 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#e9e2d0">
    <circle cx="180" cy="140" r="2.4"/><circle cx="420" cy="90" r="1.5"/><circle cx="690" cy="230" r="2.8"/>
    <circle cx="880" cy="120" r="1.7"/><circle cx="1130" cy="70" r="2.2"/><circle cx="1340" cy="260" r="1.4"/>
    <circle cx="1560" cy="140" r="2.6"/><circle cx="1780" cy="60" r="1.6"/><circle cx="2010" cy="220" r="2.1"/>
    <circle cx="2230" cy="110" r="1.3"/><circle cx="2450" cy="190" r="2.4"/><circle cx="2670" cy="80" r="1.8"/>
    <circle cx="2890" cy="240" r="2.6"/><circle cx="3120" cy="120" r="1.5"/><circle cx="3330" cy="200" r="2.2"/>
    <circle cx="3560" cy="90" r="1.7"/><circle cx="570" cy="330" r="1.2"/><circle cx="1470" cy="330" r="1.1"/>
  </g>

  <!-- moon + halo -->
  <circle cx="2980" cy="360" r="150" fill="url(#moonGlow)" opacity="0.9"/>
  <circle cx="2980" cy="360" r="88" fill="#f0dfa4"/>
  <circle cx="2952" cy="336" r="16" fill="#d8c07a" opacity="0.7"/>
  <circle cx="3020" cy="392" r="10" fill="#d8c07a" opacity="0.6"/>

  <!-- distant dune line -->
  <path d="M0 1335 L380 1318 L700 1332 L1080 1310 L1410 1334 L1730 1315 L2130 1334 L2480 1312 L2870 1334 L3240 1320 L3600 1332 L3840 1324 L3840 1500 L0 1500 Z" fill="#14100d" opacity="0.9"/>

  <!-- ground -->
  <rect y="1330" width="3840" height="830" fill="url(#sand)"/>

  <!-- pyramids -->
  <g stroke-linejoin="round">
    <path d="M300 1330 L1030 640 L1760 1330 Z" fill="url(#pFace)" stroke="#c9a227" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M1030 640 L1760 1330 L1470 1330 Z" fill="url(#pGold)" opacity="0.75"/>
    <path d="M1450 1330 L2070 780 L2690 1330 Z" fill="url(#pFace)" stroke="#c9a227" stroke-opacity="0.5" stroke-width="3.5"/>
    <path d="M2070 780 L2690 1330 L2360 1330 Z" fill="#0d0b08" opacity="0.8"/>
    <path d="M2400 1330 L2785 1005 L3170 1330 Z" fill="url(#pFace)" stroke="#c9a227" stroke-opacity="0.25" stroke-width="2.5"/>
    <path d="M3230 1330 L3535 1080 L3840 1330 Z" fill="url(#pFace)" stroke="#c9a227" stroke-opacity="0.18" stroke-width="2.5"/>
  </g>

  <!-- glowing hieroglyph band on the big pyramid (abstract glyph strokes) -->
  <g stroke="#e8c766" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#soft)">
    <path d="M760 1165 h120 M1000 1165 h80 M1240 1165 h140"/>
    <path d="M830 1215 q60 -45 120 0 M1120 1215 v-70 M1440 1215 h-110"/>
  </g>
  <g stroke="#e8c766" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
    <path d="M762 1165 h116 M1002 1165 h76 M1242 1165 h136"/>
    <path d="M832 1215 q58 -44 116 0 M1122 1215 v-68 M1440 1215 h-106"/>
  </g>

  <!-- ruined temple silhouette, left -->
  <g fill="#0b0908" stroke="#c9a227" stroke-opacity="0.28" stroke-width="2">
    <rect x="120" y="1218" width="46" height="118"/>
    <rect x="196" y="1180" width="46" height="156"/>
    <rect x="272" y="1236" width="46" height="100"/>
    <rect x="92" y="1336" width="252" height="16" stroke="none"/>
  </g>

  <!-- standing dune ridge, foreground -->
  <path d="M0 1760 C 520 1690, 900 1810, 1420 1745 C 1980 1672, 2350 1815, 2900 1740 C 3320 1695, 3620 1790, 3840 1752 L3840 2160 L0 2160 Z" fill="#0a0806"/>
  <!-- cartouche of SEKHEM, bottom right -->
  <g transform="translate(3120 1885)" stroke="#c9a227" fill="none" stroke-opacity="0.9">
    <rect x="-150" y="-46" width="700" height="92" rx="46" stroke-width="4"/>
    <line x1="-178" y1="-58" x2="-178" y2="58" stroke-width="4" stroke-linecap="round"/>
    <line x1="578" y1="-58" x2="578" y2="58" stroke-width="4" stroke-linecap="round"/>
    <text x="200" y="14" text-anchor="middle" font-family="Cinzel Decorative, Cinzel, serif" font-weight="900" font-size="44" fill="#e8c766" stroke="none" letter-spacing="14">SEKHEM</text>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.5"/>
</svg>
