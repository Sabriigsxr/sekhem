<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" role="img" aria-label="SEKHEM — hieroglyph field, faint gold glyphs on obsidian">
  <defs>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#131110"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <g id="ankh" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
      <ellipse cx="0" cy="-16" rx="10" ry="14"/>
      <path d="M-22 6 H22 M0 -2 V44 M-14 44 H14"/>
    </g>
    <g id="eye" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24 0 Q0 -17 24 0 Q0 17 -24 0 Z"/>
      <circle cx="0" cy="0" r="6.5"/>
      <path d="M-20 -12 Q0 -22 20 -12"/>
    </g>
    <g id="scarab" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="0" rx="13" ry="15"/>
      <path d="M-13 -6 H-26 M13 -6 H26 M-11 6 L-22 20 M11 6 L22 20 M-8 -14 L-16 -24 M8 -14 L16 -24"/>
    </g>
    <g id="feather" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M0 -26 C 12 -10, 12 12, 0 28 C -12 12, -12 -10, 0 -26 Z"/>
      <path d="M0 -26 V36"/>
    </g>
    <g id="water" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M-24 0 Q-12 -12 0 0 T24 0 M-24 18 Q-12 6 0 18 T24 18"/>
    </g>
    <g id="sun" stroke="currentColor" stroke-width="6" fill="none">
      <circle cx="0" cy="0" r="14"/>
      <path d="M0 -28 V-20 M0 20 V28 M-28 0 H-20 M20 0 H28 M-20 -20 L-14 -14 M20 -20 L14 -14 M-20 20 L-14 14 M20 20 L14 14" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="3840" height="2160" fill="url(#vig)"/>

  <!-- glyph field -->
  <g color="#c9a227" opacity="0.32">
    <use href="#ankh" x="220" y="180"/><use href="#eye" x="620" y="180"/><use href="#scarab" x="1030" y="180"/><use href="#feather" x="1420" y="180"/><use href="#water" x="1830" y="180"/><use href="#sun" x="2230" y="180"/><use href="#ankh" x="2620" y="180"/><use href="#eye" x="3010" y="180"/><use href="#scarab" x="3400" y="180"/>
    <use href="#feather" x="300" y="560"/><use href="#water" x="760" y="560"/><use href="#sun" x="1180" y="560"/><use href="#ankh" x="1560" y="560"/><use href="#eye" x="1950" y="560"/><use href="#scarab" x="2330" y="560"/><use href="#feather" x="2740" y="560"/><use href="#water" x="3130" y="560"/>
    <use href="#sun" x="220" y="940"/><use href="#ankh" x="610" y="940"/><use href="#eye" x="1010" y="940"/><use href="#scarab" x="1410" y="940"/><use href="#feather" x="1800" y="940"/><use href="#water" x="2200" y="940"/><use href="#sun" x="2600" y="940"/><use href="#ankh" x="3000" y="940"/><use href="#eye" x="3390" y="940"/>
    <use href="#eye" x="300" y="1320"/><use href="#scarab" x="750" y="1320"/><use href="#feather" x="1150" y="1320"/><use href="#water" x="1550" y="1320"/><use href="#sun" x="1930" y="1320"/><use href="#ankh" x="2330" y="1320"/><use href="#eye" x="2720" y="1320"/><use href="#scarab" x="3120" y="1320"/>
    <use href="#water" x="220" y="1700"/><use href="#sun" x="600" y="1700"/><use href="#ankh" x="1000" y="1700"/><use href="#eye" x="1390" y="1700"/><use href="#scarab" x="1780" y="1700"/><use href="#feather" x="2180" y="1700"/><use href="#water" x="2580" y="1700"/><use href="#sun" x="2970" y="1700"/><use href="#ankh" x="3370" y="1700"/>
  </g>

  <!-- veil + wordmark -->
  <rect width="3840" height="2160" fill="#050403" opacity="0.55"/>
  <rect x="520" y="760" width="2800" height="640" rx="36" fill="#050403" opacity="0.55" stroke="#c9a227" stroke-opacity="0.4" stroke-width="3"/>
  <text x="1920" y="1055" text-anchor="middle" font-family="Cinzel Decorative, Cinzel, serif" font-weight="900" font-size="210" fill="#e8c766" letter-spacing="60">SEKHEM</text>
  <text x="1920" y="1240" text-anchor="middle" font-family="Spectral, serif" font-size="44" fill="#a89f8a">The Pharaoh&#8217;s Pentest Codex</text>

  <rect width="3840" height="2160" fill="none" stroke="#c9a227" stroke-opacity="0.22" stroke-width="6"/>
</svg>
