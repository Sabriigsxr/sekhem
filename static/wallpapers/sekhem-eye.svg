<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" role="img" aria-label="SEKHEM — Eye of Horus, gold on obsidian with circuit traces">
  <defs>
    <radialGradient id="center" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#241c10"/>
      <stop offset="0.6" stop-color="#131110"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c766" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9b3"/>
      <stop offset="0.35" stop-color="#e8c766"/>
      <stop offset="0.7" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#6e5410"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9 0 0 0 0 0.8 0 0 0 0 0.55 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#center)"/>

  <!-- faint circuit grid -->
  <g stroke="#1fb6a6" stroke-opacity="0.16" stroke-width="2" fill="none">
    <path d="M0 540 H900 V300 H1500 M0 1620 H1100 V1900 H1900 M3840 700 H2900 V420 H2300 M3840 1480 H2760 V1760 H1800 M700 0 V700 H1500 M3200 2160 V1420 H2600"/>
    <path d="M400 880 H1200 M2640 1280 H3440 M1920 0 V500 M1920 2160 V1660"/>
    <circle cx="900" cy="300" r="6"/><circle cx="1500" cy="300" r="6"/><circle cx="1100" cy="1900" r="6"/><circle cx="2900" cy="420" r="6"/><circle cx="2600" cy="1760" r="6"/><circle cx="700" cy="700" r="6"/><circle cx="1200" cy="880" r="6"/><circle cx="2640" cy="1280" r="6"/><circle cx="1920" cy="500" r="6"/><circle cx="1920" cy="1660" r="6"/>
  </g>

  <!-- glow halo -->
  <circle cx="1920" cy="1000" r="760" fill="url(#eyeGlow)" opacity="0.75"/>

  <!-- the eye -->
  <g transform="translate(1920 1000)" stroke="url(#gold)" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- almond outline -->
    <path d="M-560 0 Q0 -380 560 0 Q0 380 -560 0 Z"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="150"/>
    <circle cx="0" cy="0" r="60" fill="url(#gold)" stroke="none"/>
    <!-- brow -->
    <path d="M-580 -210 Q0 -470 580 -210"/>
    <!-- teardrop -->
    <path d="M0 205 L0 420"/>
    <!-- spiral curl -->
    <path d="M200 205 q260 20 300 260"/>
  </g>

  <!-- concentric sacred circles -->
  <g stroke="#c9a227" stroke-opacity="0.35" fill="none">
    <circle cx="1920" cy="1000" r="900" stroke-width="2" stroke-dasharray="3 26"/>
    <circle cx="1920" cy="1000" r="1120" stroke-width="1.5" stroke-dasharray="2 40"/>
  </g>

  <!-- cartouche wordmark -->
  <g transform="translate(1920 1995)" stroke="#c9a227" fill="none" stroke-opacity="0.95">
    <rect x="-330" y="-52" width="660" height="104" rx="52" stroke-width="4"/>
    <line x1="-362" y1="-64" x2="-362" y2="64" stroke-width="4" stroke-linecap="round"/>
    <line x1="362" y1="-64" x2="362" y2="64" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="Cinzel Decorative, Cinzel, serif" font-weight="900" font-size="50" fill="#e8c766" stroke="none" letter-spacing="22">SEKHEM</text>
  </g>

  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.5"/>
</svg>
