name: Repository Activity

on:
  schedule:
    - cron: "0 0 1,16 * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Generate activity
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from collections import defaultdict
          from datetime import datetime
          from zoneinfo import ZoneInfo

          START = "<!--START_SECTION:activity-->"
          END = "<!--END_SECTION:activity-->"

          MAX_TOTAL = 20
          MAX_PER_DAY = 5

          repo = os.environ["REPO"]
          ist = ZoneInfo("Africa/Cairo")

          with open("README.md", encoding="utf-8") as f:
              original = f.read()

          start = original.find(START)
          end = original.find(END)

          if start == -1 or end == -1:
              raise SystemExit("Activity markers not found")

          result = subprocess.run(
              [
                  "git",
                  "log",
                  "-100",
                  "--pretty=format:%H%x09%s%x09%aI"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          daily_count = defaultdict(int)
          selected = []

          for line in result.stdout.splitlines():
              sha, message, timestamp = line.split("\t", 2)

              dt = datetime.fromisoformat(timestamp)
              dt = dt.astimezone(ist)

              day = dt.date()

              if daily_count[day] >= MAX_PER_DAY:
                  continue

              selected.append(
                  (
                      sha,
                      message.replace("|", "\\|"),
                      dt
                  )
              )

              daily_count[day] += 1

              if len(selected) >= MAX_TOTAL:
                  break

          rows = []

          for sha, message, dt in selected:
              rows.append(
                  f"| {dt.strftime('%d %b %Y · %H:%M EET')} | "
                  f"{message} | "
                  f"[`{sha[:7]}`]"
                  f"(https://github.com/{repo}/commit/{sha}) |"
              )

          table = (
              "| Date & Time (EET) | Activity | Commit |\n"
              "|:---|:---|:---:|\n"
              + "\n".join(rows)
          )

          section = (
              START
              + "\n"
              + table
              + "\n"
              + END
          )

          updated = (
              original[:start]
              + section
              + original[end + len(END):]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Generated {len(selected)} activities")
          PY

      - name: Safety check
        run: |
          python3 <<'PY'
          import subprocess

          START = "<!--START_SECTION:activity-->"
          END = "<!--END_SECTION:activity-->"

          old = subprocess.run(
              ["git", "show", "HEAD:README.md"],
              capture_output=True,
              text=True,
              check=True
          ).stdout

          with open("README.md", encoding="utf-8") as f:
              new = f.read()

          def outside(text):
              start = text.find(START)
              end = text.find(END)

              if start == -1 or end == -1:
                  raise SystemExit("Activity markers missing")

              return text[:start] + text[end + len(END):]

          if outside(old) != outside(new):
              raise SystemExit(
                  "README content outside activity section changed"
              )

          print("Safety check passed")

          PY

      - name: Create or update activity PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/repository-activity
          base: main
          delete-branch: false
          title: "docs: update repository activity"
          commit-message: "docs: update repository activity"
          body: |
            ## Repository Activity

            Automated update of the README activity section.

            - Maximum 20 entries
            - Maximum 5 entries per EET day
            - Only the activity section is modified
            - Deployment is completely separate
          labels: |
            documentation
            automated
